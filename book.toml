[book]
authors = ["JYU"]
language = "fi"
src = "src"
title = "Ohjelmointi 2"

[output.html]
additional-css = [
  "highlight/atelier-forest-light.css",
  "highlight/twilight.css", 
  "highlight/apprentice.css",
  "theme/alerts-style.css",
]
default-theme = "jyu-light"
preferred-dark-theme = "jyu-dark"
additional-js = [
  "mermaid/mermaid.min.js", 
  "mermaid/mermaid-init.js",
  "theme/mode-java.js",
  "theme/playground_ext.js",
]

# Repository links for the HTML theme: shows repo icon and "Suggest an edit" button
edit-url-template = "https://github.com/ohj-perus-jy/ohj2/edit/main/{path}"

[output.html.playground]
editable = true

[output.html.code.hidelines]
java = "//-"

[preprocessor.alerts]

[preprocessor.mermaid]

